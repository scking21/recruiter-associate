name: Publish recruiter container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Linux amd64 image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: docker build --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" .
      - name: Verify startup without model requests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker run -d --name recruiter-check -e NVIDIA_API_KEY=configuration-check-only "$IMAGE:$GITHUB_SHA"
          for attempt in $(seq 1 12); do
            if docker exec recruiter-check python3 scripts/container_entrypoint.py health; then
              docker stop recruiter-check
              exit 0
            fi
            sleep 5
          done
          docker logs recruiter-check
          exit 1
      - name: Publish repository image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
