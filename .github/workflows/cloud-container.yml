name: Verify recruiter cloud container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned Plow variant
        run: docker build -f deploy/cloud/Dockerfile -t recruiter-cloud:check .
      - name: Check config, reporting contract and workflow tool offline
        run: |
          docker run --rm --network none --entrypoint node recruiter-cloud:check /opt/recruiter/cloud-check.mjs
          docker run --rm --network none --entrypoint /usr/local/bin/recruiter-tool recruiter-cloud:check --help
      - name: Boot actual gateway and Plow plugin without network or reporting
        run: docker run --rm --network none -e AGENT_ID= -e RECRUITER_CLOUD_MODEL=z-ai/glm-5.2 recruiter-cloud:check /opt/plow/probe
