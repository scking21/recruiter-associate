name: Publish Roletrace cloud container
on:
  workflow_dispatch:
    inputs:
      reuse_verified_release:
        description: Reuse the September 28 verified runtime if the upstream registry is unavailable
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check review workflow and fictional adversarial cases offline
        run: python3 -m unittest discover -s recruiter -t . -v
      - name: Build pinned Plow variant
        env:
          REUSE_VERIFIED_RELEASE: ${{ inputs.reuse_verified_release }}
        run: |
          if [ "$REUSE_VERIFIED_RELEASE" = "true" ]; then
            docker build -f deploy/cloud/Dockerfile -t recruiter-cloud:check --build-arg PLOW_BASE=ghcr.io/scking21/recruiter-associate@sha256:ad99da3f5bf6643f52df1a614036ce17c98c2547cd1645dc15f3ed2c4839fde4 .
          else
            docker build -f deploy/cloud/Dockerfile -t recruiter-cloud:check .
          fi
      - name: Check config, reporting contract and workflow tool offline
        run: |
          docker run --rm --network none --entrypoint node recruiter-cloud:check /opt/recruiter/cloud-check.mjs
          docker run --rm --network none --entrypoint /usr/local/bin/recruiter-tool recruiter-cloud:check --help
          docker run --rm --network none --workdir /opt/recruiter --entrypoint python3 recruiter-cloud:check -m unittest recruiter.test_presentation -v
      - name: Boot actual gateway and Plow plugin without network or reporting
        run: docker run --rm --network none -e AGENT_ID= recruiter-cloud:check /opt/plow/probe
      - name: Publish verified cloud image
        env:
          IMAGE: ghcr.io/scking21/recruiter-associate
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker tag recruiter-cloud:check "$IMAGE:cloud-$GITHUB_SHA"
          docker tag recruiter-cloud:check "$IMAGE:cloud"
          docker push "$IMAGE:cloud-$GITHUB_SHA"
          docker push "$IMAGE:cloud"
          docker logout ghcr.io
